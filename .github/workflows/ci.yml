name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check:parser
      - run: bun run check:discover
      - run: bun run check:downloads
      - run: bun run check:reader
      - run: bun run lint
      - run: npx expo-doctor@1.21.5
